<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Gabigol","short_name":"Gabigol","start_url":".","display":"standalone","background_color":"%230f172a","theme_color":"%23020617"}'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabigol | Curious Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Outfit', sans-serif;
        }

        body { 
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            touch-action: none; 
        }
        
        .game-container { 
            position: relative; 
            text-align: center; 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px; 
            border-radius: 28px; 
            width: 92%; 
            max-width: 380px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        #gameOverOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            display: none; flex-direction: column;
            justify-content: center; align-items: center; border-radius: 28px; z-index: 10;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 24px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

        #gameOverOverlay h2 { margin-bottom: 8px; color: #f43f5e; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        #gameOverOverlay p { margin-bottom: 6px; font-size: 0.95rem; color: #cbd5e1; }
        #rewardText { color: #f59e0b; font-weight: 500; margin-bottom: 22px; font-size: 0.95rem; min-height: 24px; line-height: 1.4; }
        
        #gameOverOverlay button { 
            padding: 14px 34px; border-radius: 14px; border: none; 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); 
            color: #f8fafc; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        #gameOverOverlay button:active { transform: scale(0.96); }

        #toast {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); color: #f8fafc; 
            padding: 10px 18px; border-radius: 16px; font-weight: 500; font-size: 0.8rem; 
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 5;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(245, 158, 11, 0.2);
            max-width: 85%; text-align: center; letter-spacing: 0.2px;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 { font-size: 1.3rem; color: #f59e0b; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        
        .scores-panel {
            display: flex; gap: 12px; font-size: 0.85rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .scores-panel span strong { color: #f8fafc; font-size: 1rem; margin-left: 2px; }

        canvas { 
            background-color: #020617; 
            border-radius: 16px; 
            display: block; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 330px; 
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8); 
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .controls { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            margin-top: 20px; max-width: 230px; margin-left: auto; margin-right: auto; 
        }
        .btn { 
            background: rgba(51, 65, 85, 0.6); 
            backdrop-filter: blur(4px);
            color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 15px; border-radius: 16px; 
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            font-size: 1.2rem; font-weight: bold; user-select: none;
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3);
            transition: background 0.15s, transform 0.1s;
        }
        .btn:active { 
            background: #f59e0b; 
            color: #0f172a; 
            transform: scale(0.92); 
            box-shadow: 0 4px 8px -2px rgba(245, 158, 11, 0.5);
        }
        
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="toast">Mensaje</div>

        <div id="gameOverOverlay">
            <h2>Game Over</h2>
            <p>Puntaje final: <span id="finalScore" style="color: #f8fafc; font-weight: 700;">0</span></p>
            <p id="rewardText"></p>
            <button onclick="resetGame()">Aceptar</button>
        </div>

        <header>
            <h1>Gabigol</h1>
            <div class="scores-panel">
                <div>Score <strong id="score">0</strong></div>
                <div>Best <strong id="highScore">0</strong></div>
            </div>
        </header>
        
        <canvas id="gameCanvas" width="330" height="330"></canvas>
        
        <div class="controls">
            <button class="btn btn-up" id="upBtn">▲</button>
            <button class="btn btn-left" id="leftBtn">◄</button>
            <button class="btn btn-down" id="downBtn">▼</button>
            <button class="btn btn-right" id="rightBtn">►</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const overlay = document.getElementById("gameOverOverlay");
        const finalScoreSpan = document.getElementById("finalScore");
        const rewardText = document.getElementById("rewardText");
        const toast = document.getElementById("toast");

        const gridSize = 15;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let highScore = localStorage.getItem("gabigol_highscore") || 0;
        highScoreElement.innerText = highScore;

        let dx = 0, dy = -1;
        let snake = [{x:11, y:11}, {x:11, y:12}, {x:11, y:13}];
        let food = {x:5, y:5, isHat: false};
        let gameLoop;
        let gameSpeed = 95;
        let hatTimer = null;

        const mensajesAmor = [
            "Te quiero mucho Danna Gabriela",
            "Me encantas muchote",
            "Eres lo mas lindo que tengo",
            "No quisiera perder nunca",
            "Gabrielita es nuestra hija asi te enojes",
            "Tu eres mi neeeena cieito",
            "Me encantas de aqui a Icaro",
            "Me encanta mucho pasar el tiempo contigo",
            "Tu eres mi encantadora jeje",
            "Tu eres mi pensamiento mas hermoso",
            "Quiero verte",
            "Te extraño muchote",
            "Me encantan tus ojos",
            "Me fascinas",
            "Me encantas toita jeje",
            "Te pienso mas de lo que te imaginas"
        ];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;
                if (type === "eat") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === "hat") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(950, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === "record") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate(pattern);
                } catch (e) {}
            }
        }

        function changeDirection(newDx, newDy) {
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;
            dx = newDx;
            dy = newDy;
        }

        document.addEventListener("keydown", event => {
            initAudio();
            if (event.keyCode === 37) changeDirection(-1, 0);
            if (event.keyCode === 38) changeDirection(0, -1);
            if (event.keyCode === 39) changeDirection(1, 0);
            if (event.keyCode === 40) changeDirection(0, 1);
        });

        const setupButton = (id, newDx, newDy) => {
            const btn = document.getElementById(id);
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                initAudio();
                changeDirection(newDx, newDy);
            });
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                initAudio();
                changeDirection(newDx, newDy);
            }, { passive: false });
        };

        setupButton("upBtn", 0, -1);
        setupButton("downBtn", 0, 1);
        setupButton("leftBtn", -1, 0);
        setupButton("rightBtn", 1, 0);

        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener("touchstart", (e) => {
            initAudio();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener("touchend", (e) => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30) changeDirection(1, 0);
                else if (diffX < -30) changeDirection(-1, 0);
            } else {
                if (diffY > 30) changeDirection(0, 1);
                else if (diffY < -30) changeDirection(0, -1);
            }

            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        function main() {
            if (hasGameEnded()) {
                showGameOver();
                return;
            }
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
            gameLoop = setTimeout(main, gameSpeed);
        }

        function clearCanvas() { 
            ctx.fillStyle = "#020617"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 
        }

        function drawSnake() { 
            snake.forEach((p, i) => { 
                // Colores de Jorge (tonos marrones y cálidos de monito)
                ctx.fillStyle = i === 0 ? "#f59e0b" : "#b45309"; 
                ctx.beginPath();
                ctx.roundRect(p.x * gridSize + 1, p.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
            }); 
        }
        
        function moveSnake() {
            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0) head.x = tileCount - 1;
            else if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            else if (head.y >= tileCount) head.y = 0;

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                let pointsEarned = food.isHat ? 25 : 10;
                score += pointsEarned;
                scoreElement.innerText = score;

                if (food.isHat) {
                    playSound("hat");
                    triggerVibration([50, 50, 50]);
                    gameSpeed = 130;
                    if (hatTimer) clearTimeout(hatTimer);
                    hatTimer = setTimeout(() => { gameSpeed = 95; }, 4000);
                } else {
                    playSound("eat");
                    triggerVibration(40);
                }

                if (score > highScore) {
                    if (highScore == 0 || score - pointsEarned <= highScore) {
                        playSound("record");
                    }
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    localStorage.setItem("gabigol_highscore", highScore);
                }

                triggerRandomToast();
                createFood();
            } else {
                snake.pop();
            }
        }

        function triggerRandomToast() {
            const randomIndex = Math.floor(Math.random() * mensajesAmor.length);
            toast.innerText = mensajesAmor[randomIndex];
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        function createFood() {
            let isHatChance = Math.random() < 0.2; // 20% de probabilidad de sombrero amarillo
            food = { 
                x: Math.floor(Math.random()*tileCount), 
                y: Math.floor(Math.random()*tileCount),
                isHat: isHatChance
            };
            snake.forEach(p => { if (p.x === food.x && p.y === food.y) createFood(); });
        }

        function drawFood() { 
            let x = food.x * gridSize + gridSize / 2;
            let y = food.y * gridSize + gridSize / 2;

            if (food.isHat) {
                let hx = food.x * gridSize;
                let hy = food.y * gridSize;
                ctx.fillStyle = "#facc15"; 
                ctx.beginPath();
                ctx.roundRect(hx + 2, hy + 5, gridSize - 4, gridSize - 7, 3);
                ctx.fill();
                ctx.fillRect(hx, hy + gridSize - 4, gridSize, 3);
            } else {
                // Dibujo del banano en su forma curva real y estilizada
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(-Math.PI / 4);

                // Cuerpo curvo del banano (amarillo brillante)
                ctx.fillStyle = "#fde047";
                ctx.beginPath();
                ctx.moveTo(-7, 3);
                ctx.bezierCurveTo(-8, -4, -2, -7, 6, -5);
                ctx.bezierCurveTo(2, -3, -2, 0, -7, 3);
                ctx.fill();

                // Sombra interior para darle relieve tridimensional
                ctx.fillStyle = "#facc15";
                ctx.beginPath();
                ctx.moveTo(-5, 2);
                ctx.bezierCurveTo(-6, -2, -1, -5, 4, -4);
                ctx.bezierCurveTo(1, -2, -1, 0, -5, 2);
                ctx.fill();

                // Tallo inferior y punta superior marrón del banano
                ctx.fillStyle = "#78350f";
                ctx.fillRect(-8, 2, 2, 2); // Tallo
                ctx.fillRect(5, -6, 2, 2); // Punta

                ctx.restore();
            }
        }

        function hasGameEnded() {
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function showGameOver() {
            playSound("gameover");
            triggerVibration([100, 50, 100]);
            overlay.style.display = "flex";
            finalScoreSpan.innerText = score;
            rewardText.innerText = "Te quiero mucho Danna Gabriela, jugaste muy bien";
        }

        function resetGame() {
            overlay.style.display = "none";
            score = 0; 
            gameSpeed = 95;
            scoreElement.innerText = score;
            snake = [{x:11, y:11}, {x:11, y:12}, {x:11, y:13}];
            dx = 0; dy = -1;
            clearTimeout(gameLoop);
            if (hatTimer) clearTimeout(hatTimer);
            main();
        }

        main();
    </script>
</body>
</html>
