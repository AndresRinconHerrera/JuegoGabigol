<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabigol | Pro Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Outfit', sans-serif;
        }

        body { 
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            touch-action: none; 
        }
        
        .game-container { 
            position: relative; 
            text-align: center; 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px; 
            border-radius: 28px; 
            width: 92%; 
            max-width: 380px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        #gameOverOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            display: none; flex-direction: column;
            justify-content: center; align-items: center; border-radius: 28px; z-index: 10;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #gameOverOverlay h2 { margin-bottom: 8px; color: #f43f5e; font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
        #gameOverOverlay p { margin-bottom: 6px; font-size: 1rem; color: #cbd5e1; }
        #rewardText { color: #38bdf8; font-weight: 600; margin-bottom: 20px; font-size: 1.05rem; min-height: 24px; }
        
        #gameOverOverlay button { 
            padding: 14px 36px; border-radius: 14px; border: none; 
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
            color: #f8fafc; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        #gameOverOverlay button:active { transform: scale(0.96); }

        #toast {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; 
            padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; 
            opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; z-index: 5;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 { font-size: 1.4rem; color: #38bdf8; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        .scoreboard { font-size: 0.95rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        #score { color: #f8fafc; font-size: 1.2rem; font-weight: 700; margin-left: 4px; }

        canvas { 
            background-color: #020617; 
            border-radius: 16px; 
            display: block; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 330px; 
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8); 
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .controls { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            margin-top: 22px; max-width: 230px; margin-left: auto; margin-right: auto; 
        }
        .btn { 
            background: rgba(51, 65, 85, 0.6); 
            backdrop-filter: blur(4px);
            color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 16px; border-radius: 16px; 
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            font-size: 1.2rem; font-weight: bold; user-select: none;
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3);
            transition: background 0.15s, transform 0.1s;
        }
        .btn:active { 
            background: #38bdf8; 
            color: #0f172a; 
            transform: scale(0.92); 
            box-shadow: 0 4px 8px -2px rgba(56, 189, 248, 0.5);
        }
        
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="toast">¡Te ganaste una gabrielita!</div>

        <div id="gameOverOverlay">
            <h2>Game Over</h2>
            <p>Puntaje final: <span id="finalScore" style="color: #f8fafc; font-weight: 700;">0</span></p>
            <p id="rewardText"></p>
            <button onclick="resetGame()">Aceptar</button>
        </div>

        <header>
            <h1>Gabigol</h1>
            <div class="scoreboard">Score <strong id="score">0</strong></div>
        </header>
        
        <canvas id="gameCanvas" width="330" height="330"></canvas>
        
        <div class="controls">
            <button class="btn btn-up" id="upBtn">▲</button>
            <button class="btn btn-left" id="leftBtn">◄</button>
            <button class="btn btn-down" id="downBtn">▼</button>
            <button class="btn btn-right" id="rightBtn">►</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const overlay = document.getElementById("gameOverOverlay");
        const finalScoreSpan = document.getElementById("finalScore");
        const rewardText = document.getElementById("rewardText");
        const toast = document.getElementById("toast");

        const gridSize = 15;
        const tileCount = canvas.width / gridSize;

        let score = 0, dx = 0, dy = -1;
        let snake = [{x:11, y:11}, {x:11, y:12}, {x:11, y:13}];
        let food = {x:5, y:5};
        let gameLoop;
        let lastMilestone = 0;

        function changeDirection(newDx, newDy) {
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;
            dx = newDx;
            dy = newDy;
        }

        // Control por teclado
        document.addEventListener("keydown", event => {
            if (event.keyCode === 37) changeDirection(-1, 0);
            if (event.keyCode === 38) changeDirection(0, -1);
            if (event.keyCode === 39) changeDirection(1, 0);
            if (event.keyCode === 40) changeDirection(0, 1);
        });

        // Control por botones táctiles
        const setupButton = (id, newDx, newDy) => {
            const btn = document.getElementById(id);
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                changeDirection(newDx, newDy);
            });
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                changeDirection(newDx, newDy);
            }, { passive: false });
        };

        setupButton("upBtn", 0, -1);
        setupButton("downBtn", 0, 1);
        setupButton("leftBtn", -1, 0);
        setupButton("rightBtn", 1, 0);

        // Control por gestos de deslizamiento (Swipe) en la pantalla
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener("touchstart", (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener("touchend", (e) => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            // Comprobar si el movimiento fue lo suficientemente largo para considerarse gesto
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Deslizamiento horizontal
                if (diffX > 30) {
                    changeDirection(1, 0);  // Derecha
                } else if (diffX < -30) {
                    changeDirection(-1, 0); // Izquierda
                }
            } else {
                // Deslizamiento vertical
                if (diffY > 30) {
                    changeDirection(0, 1);  // Abajo
                } else if (diffY < -30) {
                    changeDirection(0, -1); // Arriba
                }
            }

            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        function main() {
            if (hasGameEnded()) {
                showGameOver();
                return;
            }
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
            gameLoop = setTimeout(main, 95);
        }

        function clearCanvas() { 
            ctx.fillStyle = "#020617"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 
        }

        function drawSnake() { 
            snake.forEach((p, i) => { 
                ctx.fillStyle = i === 0 ? "#38bdf8" : "#818cf8"; 
                ctx.beginPath();
                ctx.roundRect(p.x * gridSize + 1, p.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
            }); 
        }
        
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;

                let currentMilestone = Math.floor(score / 100);
                if (currentMilestone > lastMilestone) {
                    lastMilestone = currentMilestone;
                    triggerToast(currentMilestone);
                }

                createFood();
            } else {
                snake.pop();
            }
        }

        function triggerToast(count) {
            let mensaje = count === 1 ? "¡Te ganaste una gabrielita!" : `¡Te ganaste ${count} gabrielitas!`;
            toast.innerText = mensaje;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2600);
        }

        function createFood() {
            food = { x: Math.floor(Math.random()*tileCount), y: Math.floor(Math.random()*tileCount) };
            snake.forEach(p => { if (p.x === food.x && p.y === food.y) createFood(); });
        }

        function drawFood() { 
            ctx.fillStyle = "#f43f5e"; 
            ctx.beginPath(); 
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2.2, 0, Math.PI*2); 
            ctx.fill(); 
        }

        function hasGameEnded() {
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) return true;
            for (let i = 1; i < snake.length; i++) if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            return false;
        }

        function showGameOver() {
            overlay.style.display = "flex";
            finalScoreSpan.innerText = score;
            let totalGabrielitas = Math.floor(score / 100);
            if (totalGabrielitas === 0) {
                rewardText.innerText = "No alcanzaste ninguna gabrielita esta vez.";
            } else if (totalGabrielitas === 1) {
                rewardText.innerText = "¡Te ganaste 1 gabrielita!";
            } else {
                rewardText.innerText = `¡Te ganaste ${totalGabrielitas} gabrielitas!`;
            }
        }

        function resetGame() {
            overlay.style.display = "none";
            score = 0; 
            lastMilestone = 0;
            scoreElement.innerText = score;
            snake = [{x:11, y:11}, {x:11, y:12}, {x:11, y:13}];
            dx = 0; dy = -1;
            clearTimeout(gameLoop);
            main();
        }

        main();
    </script>
</body>
</html>
